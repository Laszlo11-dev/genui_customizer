name: genui_customizer
description: Runtime customization and saved appearance preferences for Flutter GenUI surfaces.
version: 0.1.0
repository: https://github.com/Laszlo11-dev/genui_customizer

environment:
  sdk: ^3.13.0
  flutter: '>=3.35.0'

dependencies:
  a2ui_core: ^0.1.0
  flutter:
    sdk: flutter
  genui: ^0.10.3
  json_schema_builder: ^0.1.7

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.26.0

flutter:
  uses-material-design: true
