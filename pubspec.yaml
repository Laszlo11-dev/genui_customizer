name: genui_customizer
description: GenUI Touch lets users customize A2UI Flutter surfaces at runtime and save appearance preferences.
version: 0.2.1
homepage: https://github.com/Laszlo11-dev/genui_customizer
repository: https://github.com/Laszlo11-dev/genui_customizer
issue_tracker: https://github.com/Laszlo11-dev/genui_customizer/issues
documentation: https://github.com/Laszlo11-dev/genui_customizer/blob/main/README.md

funding:
  - https://github.com/sponsors/Laszlo11-dev

topics:
  - flutter
  - a2ui
  - genui
  - customization
  - generative-ui

screenshots:
  - description: 'Earlier 0.1.x host: edit a live surface with the component tree and property editor.'
    path: doc/images/studio-overview.png
  - description: 'Earlier 0.1.x host: choose text styles in the compact Studio window.'
    path: doc/images/surface-editing.png
  - description: 'Earlier 0.1.x host: edit a complex layout with a live preview.'
    path: doc/images/complex-layout-ai-regeneration.png

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  a2ui_core: ^0.7.0
  a2ui_flutter: ^0.3.0
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  skills_lint: ^0.5.3+1

flutter:
  uses-material-design: true
