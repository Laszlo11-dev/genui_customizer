name: genui_customizer
description: Runtime customization and saved appearance preferences for Flutter GenUI surfaces.
version: 0.1.0
homepage: https://laszlo11-dev.github.io/genui_customizer/
repository: https://github.com/Laszlo11-dev/genui_customizer
issue_tracker: https://github.com/Laszlo11-dev/genui_customizer/issues
documentation: https://github.com/Laszlo11-dev/genui_customizer/blob/main/example/INSTALL_GUIDE.md

funding:
  - https://github.com/sponsors/Laszlo11-dev

topics:
  - flutter
  - genui
  - a2ui
  - customization
  - generative-ui

screenshots:
  - description: 'Edit a live GenUI surface with the component tree, property editor, and selected widget preview.'
    path: doc/images/studio-overview.png
  - description: 'Choose text styles in the compact Studio while previewing changes in the running application.'
    path: doc/images/surface-editing.png

environment:
  sdk: ^3.13.0
  flutter: '>=3.35.0'

dependencies:
  a2ui_core: ^0.1.1
  flutter:
    sdk: flutter
  genui: ^0.10.4
  json_schema_builder: ^0.1.7

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
