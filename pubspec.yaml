name: genui_customizer
description: GenUI Touch lets users customize Flutter GenUI interfaces at runtime and save appearance preferences.
version: 0.1.0
homepage: https://laszlo11-dev.github.io/genui_customizer/
repository: https://github.com/Laszlo11-dev/genui_customizer
issue_tracker: https://github.com/Laszlo11-dev/genui_customizer/issues
documentation: https://github.com/Laszlo11-dev/genui_customizer/blob/main/example/INSTALL_GUIDE.md

funding:
  - https://github.com/sponsors/Laszlo11-dev

topics:
  - flutter
  - genui
  - a2ui
  - customization
  - generative-ui

screenshots:
  - description: 'Edit a live GenUI surface with the component tree, property editor, and selected widget preview.'
    path: doc/images/studio-overview.png
  - description: 'Choose text styles in the compact GenUI Touch window while previewing changes in the running application.'
    path: doc/images/surface-editing.png
  - description: 'Edit a complex layout with a live preview, AI regeneration preferences, and widget-level AI edits.'
    path: doc/images/complex-layout-ai-regeneration.png

environment:
  sdk: ^3.13.0
  flutter: '>=3.35.7'

platforms:
  android:
  ios:
  macos:
  web:
  windows:

dependencies:
  a2ui_core: ^0.1.1
  flutter:
    sdk: flutter
  genui: ^0.10.4
  json_schema_builder: ^0.1.7
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  skills_lint: ^0.5.3+1

flutter:
  uses-material-design: true
