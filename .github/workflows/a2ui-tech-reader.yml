name: Check A2UI Tech Reader

on:
  pull_request:
    paths:
      - '.github/workflows/a2ui-tech-reader.yml'
      - '.fvmrc'
      - 'examples/a2ui_tech_reader/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/a2ui-tech-reader.yml'
      - '.fvmrc'
      - 'examples/a2ui_tech_reader/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/a2ui_tech_reader
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build web --release --no-pub
