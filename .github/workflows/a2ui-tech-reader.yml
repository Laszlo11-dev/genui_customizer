name: Check package and A2UI examples

on:
  pull_request:
    paths:
      - '.github/workflows/a2ui-tech-reader.yml'
      - '.fvmrc'
      - 'example/**'
      - 'examples/a2ui_flutter_chat/**'
      - 'test/**'
      - 'analysis_options.yaml'
      - 'skills/**'
      - 'skills_lint.yaml'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/a2ui-tech-reader.yml'
      - '.fvmrc'
      - 'example/**'
      - 'examples/a2ui_flutter_chat/**'
      - 'test/**'
      - 'analysis_options.yaml'
      - 'skills/**'
      - 'skills_lint.yaml'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ['.', 'example', 'examples/a2ui_flutter_chat']
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - if: matrix.app == '.'
        run: dart run skills_lint
      - if: matrix.app != '.'
        run: flutter build web --release --no-pub
