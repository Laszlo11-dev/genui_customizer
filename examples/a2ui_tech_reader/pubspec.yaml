name: a2ui_tech_reader
description: An RSS-driven A2UI Flutter news reader with GenUI Touch appearance editing.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  a2ui_core: ^0.7.0
  a2ui_flutter: ^0.3.0
  genui_customizer:
    path: ../..
  shared_preferences: ^2.5.6
  json_schema_builder: ^0.1.7
  http: ^1.6.0
  xml: ^7.1.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
