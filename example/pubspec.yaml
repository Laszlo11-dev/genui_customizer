name: a2ui_flutter_touch_example
description: Official A2UI Flutter chat example with GenUI Touch integration.
publish_to: none
environment:
  sdk: ^3.13.0
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
  a2ui_agent: ^0.3.0
  a2ui_core: ^0.7.0
  a2ui_flutter: ^0.3.0
  dartantic_ai: ^3.1.0
  flutter_markdown_plus: ^1.0.7
  googleai_dart: ^8.0.0
  url_launcher: ^6.3.2
  genui_customizer:
    path: ..
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
